# ============================================================
# NETLIFY CONFIGURATION — Form Discovery Clienti
# ============================================================

[build]
  # Nessun build step: file HTML/CSS/JS statici serviti direttamente
  publish = "."
  command = ""

[functions]
  # Directory delle Netlify Functions (invio email via Resend)
  directory = "netlify/functions"

# Redirect per pagina 404 personalizzata (opzionale)
[[redirects]]
  from = "/404"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
